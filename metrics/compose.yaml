name: rust-local-metrics

services:
  influxdb:
    image: influxdb:1.8.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:18086:8086"
    environment:
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      INFLUXDB_ADMIN_USER: metrics_admin
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?Copy .env.example to .env and set INFLUXDB_ADMIN_PASSWORD}
      INFLUXDB_WRITE_USER: rust_writer
      INFLUXDB_WRITE_USER_PASSWORD: ${INFLUXDB_WRITE_USER_PASSWORD:?Set INFLUXDB_WRITE_USER_PASSWORD in .env}
      INFLUXDB_READ_USER: grafana_reader
      INFLUXDB_READ_USER_PASSWORD: ${INFLUXDB_READ_USER_PASSWORD:?Set INFLUXDB_READ_USER_PASSWORD in .env}
      INFLUXDB_DATA_MAX_VALUES_PER_TAG: "0"
      INFLUXDB_DATA_MAX_SERIES_PER_DATABASE: "0"
      INFLUXDB_DATA_INDEX_VERSION: tsi1
      INFLUXDB_META_RETENTION_AUTOCREATE: "false"
      INFLUXDB_REPORTING_DISABLED: "true"
    volumes:
      - influxdb-data:/var/lib/influxdb
      - ./influxdb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          influx -host 127.0.0.1 -username "$$INFLUXDB_ADMIN_USER"
          -password "$$INFLUXDB_ADMIN_PASSWORD"
          -execute 'SHOW RETENTION POLICIES ON "rust-server-metrics"'
          | grep -q 'local_14d'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "127.0.0.1:13001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: localadmin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      INFLUXDB_READ_USER_PASSWORD: ${INFLUXDB_READ_USER_PASSWORD:?Set INFLUXDB_READ_USER_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/server-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -q -O - http://127.0.0.1:3000/api/health | grep -q ''"database": "ok"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  influxdb-data:
  grafana-data:
